name: Sync upstream

on:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: Run even when upstream hasn't moved
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency: sync-upstream

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - name: Sync
        id: sync
        env:
          WORK: ${{ runner.temp }}/sync
          FORCE: ${{ inputs.force && '1' || '' }}
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
        run: |
          set +e
          scripts/sync-upstream.sh
          echo "status=$?" >> "$GITHUB_OUTPUT"
      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ runner.temp }}/sync/report.md
        run: |
          [ -f "$REPORT" ] || exit 0 # upstream hasn't moved
          paths=(internal/tools/docs/resources internal/parity/testdata/ref-tools.json internal/parity/testdata/UPSTREAM)
          if [ -z "$(git status --porcelain -- "${paths[@]}")" ]; then
            echo "nothing changed"
            exit 0
          fi
          sha=$(awk '$1 == "microsoft/mcp" {print substr($2, 1, 7)}' internal/parity/testdata/UPSTREAM)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C sync/upstream
          git add -- "${paths[@]}"
          git commit -m "Sync with upstream microsoft/mcp $sha"
          git push -f origin sync/upstream
          title="Sync with upstream microsoft/mcp $sha"
          if [ "$(gh pr view sync/upstream --json state --jq .state 2>/dev/null)" = OPEN ]; then
            gh pr edit sync/upstream --title "$title" --body-file "$REPORT"
          else
            gh pr create --head sync/upstream --title "$title" --body-file "$REPORT"
          fi
      - name: Summarize
        if: always()
        env:
          REPORT: ${{ runner.temp }}/sync/report.md
        run: if [ -f "$REPORT" ]; then cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sync-logs
          path: ${{ runner.temp }}/sync/*.log
          if-no-files-found: ignore
      - name: Fail when a check failed
        if: steps.sync.outputs.status != '0'
        run: exit 1
